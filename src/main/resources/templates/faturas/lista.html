<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Faturas')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <!-- Filtro de datas -->
<form method="get" action="/faturas" style="display:flex;gap:10px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;">
    <input type="hidden" name="filtro" th:value="${filtro}"/>
    <div class="form-group" style="margin:0">
        <label>Data Início</label>
        <input type="date" name="dataInicio" class="form-control"
               th:value="${dataInicio}"/>
    </div>
    <div class="form-group" style="margin:0">
        <label>Data Fim</label>
        <input type="date" name="dataFim" class="form-control"
               th:value="${dataFim}"/>
    </div>
    <button type="submit" class="btn btn-primary">🔍 Filtrar</button>
    <a th:href="@{/faturas(filtro=${filtro})}" class="btn btn-ghost">✖ Limpar</a>
    <button type="button" class="btn btn-outline" onclick="window.print()">🖨️ Imprimir</button>
</form>
        <div>
            <h1 class="page-title">Faturas</h1>
            <p class="page-subtitle" th:text="${faturas.size() + ' fatura(s) encontrada(s)'}"></p>
        </div>
        <a th:href="@{/faturas/nova}" class="btn btn-primary">+ Nova Fatura</a>
    </div>

    <!-- Filtros -->
    <div class="filter-tabs">
        <a th:href="@{/faturas}" th:classappend="${filtro == 'todas' ? 'tab-active' : ''}">Todas</a>
        <a th:href="@{/faturas(filtro='pendentes')}" th:classappend="${filtro == 'pendentes' ? 'tab-active' : ''}">
            Pendentes
            <span th:if="${qtdPendentes > 0}" class="tab-badge" th:text="${qtdPendentes}"></span>
        </a>
        <a th:href="@{/faturas(filtro='vencidas')}" th:classappend="${filtro == 'vencidas' ? 'tab-active' : ''}">
            Vencidas
            <span th:if="${qtdVencidas > 0}" class="tab-badge tab-badge-red" th:text="${qtdVencidas}"></span>
        </a>
        <a th:href="@{/faturas(filtro='pagas')}" th:classappend="${filtro == 'pagas' ? 'tab-active' : ''}">Pagas</a>
    </div>

    <div class="section-card">
        <div th:if="${#lists.isEmpty(faturas)}" class="empty-state">
            <span>🧾</span>
            <p>Nenhuma fatura encontrada.</p>
        </div>

        <table th:unless="${#lists.isEmpty(faturas)}" class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th>Referência</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Pagamento</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${faturas}" th:classappend="${f.status.name() == 'VENCIDO' ? 'row-vencido' : ''}">
                    <td th:text="${f.id}">1</td>
                    <td>
                        <strong th:text="${f.cliente.nome}">—</strong>
                        <br/>
                        <small th:if="${f.cliente.plano != null}" th:text="${f.cliente.plano.nome}" style="color:#888">—</small>
                    </td>
                    <td th:text="${f.referenciaMes ?: '—'}">—</td>
                    <td><strong th:text="${'R$ ' + #numbers.formatDecimal(f.valor, 1, 'POINT', 2, 'COMMA')}">—</strong></td>
                    <td th:text="${#temporals.format(f.dataVencimento, 'dd/MM/yyyy')}">—</td>
                    <td th:text="${f.dataPagamento != null ? #temporals.format(f.dataPagamento, 'dd/MM/yyyy') : '—'}">—</td>
                    <td>
                        <span th:class="${'badge badge-' + #strings.toLowerCase(f.status)}"
                              th:text="${f.status == T(com.ispmanager.model.Fatura.StatusFatura).PAGO ? 'Pago' :
                                         f.status == T(com.ispmanager.model.Fatura.StatusFatura).PENDENTE ? 'Pendente' :
                                         f.status == T(com.ispmanager.model.Fatura.StatusFatura).VENCIDO ? 'Vencido' : 'Cancelado'}">
                        </span>
                    </td>
                    <td class="actions-cell">
                        <!-- Botão de baixa só aparece para pendentes e vencidas -->
                        <span th:if="${f.status.name() == 'PENDENTE' or f.status.name() == 'VENCIDO'}">
                            <button type="button" class="btn btn-sm btn-success"
                                    th:attr="data-id=${f.id}"
                                    onclick="abrirModalBaixa(this)">✅ Baixa</button>
                        </span>
                        <form th:if="${f.status.name() != 'PAGO' and f.status.name() != 'CANCELADO'}"
                              th:action="@{'/faturas/' + ${f.id} + '/cancelar'}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-ghost" onclick="return confirm('Cancelar fatura?')">✖</button>
                        </form>
                        <form th:if="${f.status.name() == 'PAGO'}"
                              th:action="@{'/faturas/' + ${f.id} + '/estornar'}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Estornar pagamento?')">↩ Estornar</button>
                        </form>
                    </td>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal de baixa -->
    <div id="modalBaixa" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3>💰 Registrar Pagamento</h3>
            <p>Informe a data do pagamento:</p>
            <form id="formBaixa" method="post">
                <div class="form-group">
                    <label>Data do Pagamento</label>
                    <input type="date" name="dataPagamento" id="inputDataPgto" class="form-control"/>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-success">✅ Confirmar Pagamento</button>
                </div>
            </form>
        </div>
    </div>

</section>
</body>
</html>
