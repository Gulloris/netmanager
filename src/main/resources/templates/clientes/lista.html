<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Clientes')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Clientes</h1>
            <p class="page-subtitle" th:text="${clientes.size() + ' cliente(s) cadastrado(s)'}"></p>
        </div>
        <a th:href="@{/clientes/novo}" class="btn btn-primary">+ Novo Cliente</a>
    </div>

    <div class="search-bar">
        <form th:action="@{/clientes}" method="get">
            <input type="text" name="busca" th:value="${busca}" placeholder="🔍 Buscar por nome..." class="input-search"/>
            <button type="submit" class="btn btn-outline">Buscar</button>
            <a th:if="${busca != null}" th:href="@{/clientes}" class="btn btn-ghost">Limpar</a>
        </form>
    </div>

    <div class="section-card">
        <div th:if="${#lists.isEmpty(clientes)}" class="empty-state">
            <span>👤</span>
            <p>Nenhum cliente encontrado.</p>
            <a th:href="@{/clientes/novo}" class="btn btn-primary">Cadastrar primeiro cliente</a>
        </div>

        <table th:unless="${#lists.isEmpty(clientes)}" class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Plano</th>
                    <th>Vencimento</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}">1</td>
                    <td>
                        <strong th:text="${c.nome}">Nome</strong>
                        <br/>
                        <small th:text="${c.email}" style="color:#888">email</small>
                    </td>
                    <td th:text="${c.telefone ?: '—'}">—</td>
                    <td>
                        <span th:if="${c.plano != null}" th:text="${c.plano.nome + ' (' + c.plano.velocidadeMbps + ' Mbps)'}">—</span>
                        <span th:unless="${c.plano != null}" style="color:#aaa">Sem plano</span>
                    </td>
                    <td th:text="${c.diaVencimento != null ? 'Dia ' + c.diaVencimento : '—'}">—</td>
                    <td><span class="badge badge-pago" th:if="${c.ativo}">Ativo</span>
                        <span class="badge badge-cancelado" th:unless="${c.ativo}">Inativo</span></td>
                    <td class="actions-cell">
                        <a th:href="@{'/clientes/' + ${c.id} + '/editar'}" class="btn btn-sm btn-outline">✏️</a>
                        <form th:action="@{'/faturas/gerar/' + ${c.id}}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-outline" title="Gerar fatura" onclick="return confirm('Gerar fatura para este cliente?')">🧾</button>
                        </form>
                        <form th:action="@{'/clientes/' + ${c.id} + '/inativar'}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Inativar este cliente?')">🗑️</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
</body>
</html>
