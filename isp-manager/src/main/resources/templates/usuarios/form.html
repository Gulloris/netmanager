<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Usuário')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title"
                th:text="${usuario.id != null ? 'Editar Usuário' : 'Novo Usuário'}">Novo Usuário</h1>
            <p class="page-subtitle">Gerencie o acesso à aplicação.</p>
        </div>
        <a th:href="@{/usuarios}" class="btn btn-outline">← Voltar</a>
    </div>

    <div class="section-card" style="max-width:700px">
        <form th:action="${usuario.id != null ? '/usuarios/' + usuario.id + '/editar' : '/usuarios/novo'}"
              method="post" class="form-grid">

            <div class="form-group">
                <label for="nomeCompleto">Nome completo *</label>
                <input id="nomeCompleto" type="text" name="nomeCompleto"
                       th:value="${usuario.nomeCompleto}" required class="form-control"
                       placeholder="Ex: João da Silva"/>
            </div>

            <div class="form-group">
                <label for="username">Usuário *</label>
                <input id="username" type="text" name="username"
                       th:value="${usuario.username}" required class="form-control"
                       placeholder="Ex: joao.silva" autocomplete="username"/>
            </div>

            <div class="form-group">
                <label for="role">Perfil *</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="USER" th:selected="${usuario.role == 'USER'}">Usuário</option>
                    <option value="ADMIN" th:selected="${usuario.role == 'ADMIN'}">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ativo">Status *</label>
                <select id="ativo" name="ativo" class="form-control" required>
                    <option value="true" th:selected="${usuario.ativo}">Ativo</option>
                    <option value="false" th:selected="${!usuario.ativo}">Inativo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senha">Senha <span th:if="${usuario.id == null}">*</span></label>
                <input id="senha" type="password" name="senha" class="form-control"
                       th:required="${usuario.id == null}" minlength="6"
                       autocomplete="new-password"
                       th:placeholder="${usuario.id != null ? 'Deixe em branco para manter a senha atual' : 'Mínimo de 6 caracteres'}"/>
                <span th:if="${usuario.id != null}" class="field-error">
                    Deixe em branco caso não queira alterar a senha.
                </span>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar senha <span th:if="${usuario.id == null}">*</span></label>
                <input id="confirmarSenha" type="password" name="confirmarSenha" class="form-control"
                       th:required="${usuario.id == null}" minlength="6"
                       autocomplete="new-password"
                       placeholder="Repita a senha"/>
            </div>

            <div class="form-actions full-width">
                <a th:href="@{/usuarios}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${usuario.id != null ? '💾 Salvar alterações' : '✅ Cadastrar usuário'}">
                    Cadastrar usuário
                </button>
            </div>
        </form>
    </div>

</section>
</body>
</html>
