<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:replace="~{layout :: layout(~{::section}, 'Usuários')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Usuários</h1>
            <p class="page-subtitle" th:text="${usuarios.size() + ' usuário(s) cadastrado(s)'}"></p>
        </div>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">+ Novo Usuário</a>
    </div>

    <div class="section-card">
        <div th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
            <span>🔐</span>
            <p>Nenhum usuário cadastrado.</p>
            <a th:href="@{/usuarios/novo}" class="btn btn-primary">Cadastrar usuário</a>
        </div>

        <table th:unless="${#lists.isEmpty(usuarios)}" class="table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Usuário</th>
                    <th>Perfil</th>
                    <th>Status</th>
                    <th>Criado em</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td>
                        <strong th:text="${u.nomeCompleto ?: '—'}">—</strong>
                    </td>
                    <td th:text="${u.username}">usuario</td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role == 'ADMIN' ? ' badge-pago' : ' badge-pendente'}"
                              th:text="${u.role}">USER</span>
                    </td>
                    <td>
                        <span th:if="${u.ativo}" class="badge badge-pago">Ativo</span>
                        <span th:unless="${u.ativo}" class="badge badge-cancelado">Inativo</span>
                    </td>
                    <td th:text="${u.criadoEm != null ? #temporals.format(u.criadoEm, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                    <td class="actions-cell">
                        <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}"
                           class="btn btn-sm btn-outline">✏️ Editar</a>

                        <form th:action="@{'/usuarios/' + ${u.id} + '/status'}"
                              method="post" style="display:inline"
                              th:if="${u.username != #authentication.name}">
                            <button type="submit"
                                    class="btn btn-sm"
                                    th:classappend="${u.ativo ? ' btn-danger' : ' btn-success'}"
                                    th:text="${u.ativo ? '🔒 Desativar' : '🔓 Ativar'}"
                                    onclick="return confirm(this.innerText.includes('Desativar') ? 'Desativar este usuário?' : 'Ativar este usuário?')">
                                Alterar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</section>
</body>
</html>
