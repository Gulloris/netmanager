<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      th:fragment="layout(content, titulo)"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo != null ? titulo + ' | NetManager' : 'NetManager'}">NetManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">NetManager</span>
    </div>
   <ul class="nav-links">
    <li><a th:href="@{/}" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
        <span class="nav-icon">📊</span> Dashboard
    </a></li>
    <li><a th:href="@{/clientes}" th:classappend="${currentPage == 'clientes' ? 'active' : ''}">
        <span class="nav-icon">👥</span> Clientes
    </a></li>
    <li><a th:href="@{/planos}" th:classappend="${currentPage == 'planos' ? 'active' : ''}">
        <span class="nav-icon">📶</span> Planos
    </a></li>
    <li><a th:href="@{/faturas}" th:classappend="${currentPage == 'faturas' ? 'active' : ''}">
        <span class="nav-icon">💰</span> Faturas
    </a></li>
</ul>

<div class="sidebar-user">
    <span class="sidebar-username" sec:authentication="name">usuário</span>
    <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="btn btn-ghost btn-sm logout-btn">
            <span class="nav-icon">🚪</span> Sair
        </button>
    </form>
</div>
</nav>

<main class="main-content">
    <div class="content-wrapper">

        <div th:if="${sucesso}" class="alert alert-success">
            <span>✅</span> <span th:text="${sucesso}"></span>
        </div>
        <div th:if="${erro}" class="alert alert-error">
            <span>❌</span> <span th:text="${erro}"></span>
        </div>

        <div th:replace="${content}">Conteúdo</div>

    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
