<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Planos')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Planos de Internet</h1>
            <p class="page-subtitle" th:text="${planos.size() + ' plano(s) cadastrado(s)'}"></p>
        </div>
        <a th:href="@{/planos/novo}" class="btn btn-primary">+ Novo Plano</a>
    </div>

    <div class="plans-grid">
        <div th:if="${#lists.isEmpty(planos)}" class="empty-state">
            <span>📶</span>
            <p>Nenhum plano cadastrado.</p>
            <a th:href="@{/planos/novo}" class="btn btn-primary">Criar primeiro plano</a>
        </div>

        <div th:each="p : ${planos}" th:class="${'plan-card' + (p.ativo ? '' : ' plan-inactive')}">
            <div class="plan-header">
                <div class="plan-speed" th:text="${p.velocidadeMbps + ' Mbps'}">100 Mbps</div>
                <span th:if="${p.ativo}" class="badge badge-pago">Ativo</span>
                <span th:unless="${p.ativo}" class="badge badge-cancelado">Inativo</span>
            </div>
            <div class="plan-name" th:text="${p.nome}">Plano</div>
            <div class="plan-desc" th:text="${p.descricao ?: ''}">Descrição</div>
            <div class="plan-price">
                <span class="price-currency">R$</span>
                <span class="price-value" th:text="${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                <span class="price-period">/mês</span>
            </div>
            <div class="plan-actions">
                <a th:href="@{'/planos/' + ${p.id} + '/editar'}" class="btn btn-sm btn-outline">✏️ Editar</a>
                <form th:action="@{'/planos/' + ${p.id} + '/inativar'}" method="post" style="display:inline" th:if="${p.ativo}">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Inativar este plano?')">🗑️</button>
                </form>
            </div>
        </div>
    </div>

</section>
</body>
</html>
