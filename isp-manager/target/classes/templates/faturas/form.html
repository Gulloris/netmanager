<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Nova Fatura')}"
      lang="pt-BR">
<body>
<section th:fragment="content">

    <div class="page-header">
        <div><h1 class="page-title">Nova Fatura</h1></div>
        <a th:href="@{/faturas}" class="btn btn-outline">← Voltar</a>
    </div>

    <div class="section-card" style="max-width:600px">
        <form action="/faturas/nova" method="post" class="form-grid">

            <div class="form-group full-width">
                <label>Cliente *</label>
                <select name="clienteId" required class="form-control" id="selectCliente">
                    <option value="">— Selecione o Cliente —</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c.id}"
                            th:text="${c.nome + (c.plano != null ? ' — ' + c.plano.nome : '')}"
                            th:attr="data-valor=${c.plano != null ? c.plano.valor : ''}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Valor (R$) *</label>
                <input type="number" name="valor" id="inputValor" required class="form-control"
                       step="0.01" min="0" placeholder="0,00"/>
            </div>

            <div class="form-group">
                <label>Data de Vencimento *</label>
                <input type="date" name="dataVencimento" required class="form-control"/>
            </div>

            <div class="form-group">
                <label>Referência (Mês/Ano)</label>
                <input type="text" name="referenciaMes" class="form-control" placeholder="Ex: 06/2025"/>
            </div>

            <div class="form-group full-width">
                <label>Observação</label>
                <textarea name="observacao" class="form-control" rows="2" placeholder="Opcional"></textarea>
            </div>

            <!-- Checkbox faturas anuais -->
            <div class="form-group full-width" style="background:var(--bg3);padding:16px;border-radius:8px;border:1px solid var(--border)">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;text-transform:none;font-size:14px;">
                    <input type="checkbox" name="gerarAnual" id="checkAnual" value="true" style="width:18px;height:18px;cursor:pointer;accent-color:var(--primary)"/>
                    <span>📅 Gerar faturas para os <strong>12 meses seguintes</strong> automaticamente</span>
                </label>
                <p style="color:var(--text2);font-size:12px;margin-top:8px;margin-left:28px;">
                    Serão criadas 12 faturas mensais a partir do mês seguinte ao vencimento informado, com o mesmo valor.
                </p>
            </div>

            <div class="form-actions full-width">
                <a th:href="@{/faturas}" class="btn btn-ghost">Cancelar</a>
                <button type="submit" class="btn btn-primary">🧾 Criar Fatura</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('selectCliente').addEventListener('change', function() {
            const opt = this.options[this.selectedIndex];
            const val = opt.getAttribute('data-valor');
            if (val) document.getElementById('inputValor').value = val;
        });
    </script>

</section>
</body>
</html>
